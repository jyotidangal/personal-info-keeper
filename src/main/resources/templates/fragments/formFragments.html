<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div  th:fragment="form" class="card-body">
    <h2 class="card-title text-center fw-bold text-success mb-4">Personal Information Form</h2>
    <form th:action="@{/personalInfo/save}" method="post" th:object="${personDto}" enctype="multipart/form-data" class="row g-3">
        <!-- encoding type=enctype=multipart/form-data-->
        <div class="col-md-6">
            <label class="form-label fw-medium text-secondary">First Name</label>
            <input type="text" th:field="${personDto.firstName}" placeholder="Enter first name" class="form-control">
        </div>
        <div class="col-md-6">
            <label class="form-label fw-medium text-secondary">Last Name</label>
            <input type="text" th:field="${personDto.lastName}" placeholder="Enter last name" class="form-control">
        </div>
        <div class="col-12">
            <label class="form-label fw-medium text-secondary">Email</label>
            <input type="email" th:field="${personDto.email}" placeholder="Enter email" class="form-control">
        </div>
        <div class="col-12">
            <label class="form-label fw-medium text-secondary">Address</label>
            <textarea th:field="${personDto.address}" rows="2" placeholder="Enter address" class="form-control"></textarea>
        </div>
        <div class="col-md-6">
            <label class="form-label fw-medium text-secondary">Gender</label>
            <select th:field="${personDto.gender}" class="form-select">
                <option value="">Select gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label fw-medium text-secondary">Profile Picture</label>
            <input type="file" th:field="${personDto.profilePictureList}" class="form-control" multiple>
        </div>
        <div class="col-12 text-center mt-3">
            <button type="submit" class="btn btn-danger text-white fw-bold px-4 py-2" >Submit</button>
        </div>
    </form>
</div>

</body>
</html>
